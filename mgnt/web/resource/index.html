<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISC-C-WEB</title>
    <!-- 引用 CSS -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- 卡片容器：整个内容被包裹在 .container 中 -->
    <div class="container">
        <!-- 主标题 -->
        <h1>
            <span>Welcome</span> To MISC-C-WEB
        </h1>
        
        <!-- 内容区域 -->
        <div class="content">
            <p>这里是MISC-C项目的web管理页面</p>
        </div>

        <!-- 内部模块网格 -->
        <div class="card-grid">
            <div class="card-item" style="order: 1;">
                <h3>Environment Sensor</h3>
                <p id="env_temp">Temperature: -- ℃</p>
                <p id="env_humi">Humidity: -- %RH</p>
            </div>
            <div class="card-item" style="order: 2;">
                <h3 id="led_status">Led Status: UNKNOWN</h3>
                <button id="led_turn_btn" class="btn">Turn LED</button>
            </div>
            <div class="card-item" style="order: 3;">
                <h3>TODO</h3>
                <p>TODO</p>
            </div>
        </div>

        <h2>
            <span>How</span> To Contact Me
        </h2>
        <div class="content">
            E-Mail: sybstudy@yeah.net       <br>
            Github: iammcai                 <br>
            公众号: codefishh               <br>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            &copy; 2026 MISC-C-WEB · V 1.0
        </div>
    </div>

    <!-- 引入js -->
    <script src="/app.js"></script>
</body>
</html>
